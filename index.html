<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#5BA9F0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="description" content="Bunny Learning — playful Chinese and Spanish practice for kids." />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" type="image/png" href="icon-192.png" />
<title>Bunny Learning · Chinese &amp; Spanish</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
<style>

  :root{
    --ink:#3B3024; --ink-soft:#7A6A58;
    --sky:#CFEAFF; --cream:#FFF7E8; --paper:#FFFFFF;
    --coral:#FF7A6B; --coral-d:#E85B4C;
    --sun:#FFC43C; --sun-d:#E9A700;
    --mint:#46C9A0; --mint-d:#2FA784;
    --blue:#5BA9F0; --blue-d:#3C87CE;
    --grape:#A87BE6; --grape-d:#8A5FCB;
    --pink:#FF9ECF;
    --good:#46C9A0; --bad:#FF7A6B;
    --line:#F0E3CC;
    --shadow:0 14px 0 rgba(0,0,0,.07), 0 22px 40px -18px rgba(60,40,20,.4);
    --display:'Fredoka',system-ui,sans-serif;
    --body:'Nunito',system-ui,sans-serif;
    --zh:'Nunito','PingFang TC','PingFang HK','Microsoft JhengHei','Noto Sans TC','Noto Sans CJK TC',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;font-family:var(--body);color:var(--ink);
    background:
      radial-gradient(120% 60% at 50% -10%, var(--sky), transparent 60%),
      linear-gradient(180deg,#EAF6FF, #FFF7E8 55%);
    background-attachment:fixed;min-height:100svh;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .clouds{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .cloud{position:absolute;width:120px;height:40px;background:#fff;border-radius:40px;opacity:.55;
    box-shadow:30px -14px 0 -2px #fff, -28px -8px 0 -6px #fff;animation:drift 40s linear infinite}
  .cloud.c1{top:8%}
  .cloud.c2{top:24%;left:-160px;transform:scale(.8);animation-duration:55s}
  .cloud.c3{top:44%;left:-200px;transform:scale(1.15);opacity:.4;animation-duration:70s}
  @keyframes drift{from{transform:translateX(-180px)}to{transform:translateX(115vw)}}

  .app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:18px 16px calc(110px + env(safe-area-inset-bottom));min-height:100svh}
  .screen{display:none;animation:pop .35s cubic-bezier(.2,.9,.3,1.2) both}
  .screen.on{display:block}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.99)}}

  .bun{width:84px;height:84px;flex:none}
  .bun.sm{width:54px;height:54px}

  /* header / brand */
  .top{display:flex;align-items:center;gap:12px;margin:6px 2px 18px}
  .wm{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.4px;line-height:1}
  .wm small{display:block;font-family:var(--body);font-weight:800;font-size:12.5px;color:var(--ink-soft);letter-spacing:.3px}
  .coins{margin-left:auto;background:#fff;border:3px solid var(--sun);border-radius:999px;padding:6px 14px 6px 10px;
    font-family:var(--display);font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:0 6px 0 rgba(233,167,0,.25)}

  .bubble{background:#fff;border:3px solid var(--line);border-radius:22px;padding:14px 16px;position:relative;font-weight:800;font-size:16px;box-shadow:var(--shadow)}
  .hello{display:flex;align-items:center;gap:14px;margin-bottom:20px}

  /* chapter cards */
  .grid{display:grid;gap:16px}
  .chap{border:none;cursor:pointer;text-align:left;color:#fff;border-radius:26px;padding:20px 18px;font-family:var(--body);
    position:relative;overflow:hidden;box-shadow:var(--shadow);transition:transform .12s;width:100%}
  .chap:active{transform:translateY(3px)}
  .chap .badge{font-family:var(--display);font-weight:700;font-size:13px;background:rgba(255,255,255,.28);padding:4px 12px;border-radius:999px;display:inline-block}
  .chap h2{font-family:var(--display);font-weight:700;font-size:24px;margin:10px 0 4px}
  .chap h2 .zh{font-family:var(--zh);opacity:.85;font-size:16px;font-weight:600;margin-left:8px}
  .chap p{margin:0;font-weight:800;opacity:.95;font-size:14px}
  .chap .em{position:absolute;right:-6px;bottom:-12px;font-size:84px;opacity:.9;transform:rotate(-8deg)}
  .chap .stars{margin-top:12px;font-size:15px;font-weight:900;letter-spacing:1px}
  .ch1{background:linear-gradient(135deg,var(--coral),var(--sun))}
  .ch2{background:linear-gradient(135deg,var(--mint),#7BD46B)}
  .ch3{background:linear-gradient(135deg,var(--blue),var(--grape))}

  /* lesson list */
  .bar{display:flex;align-items:center;gap:12px;margin:2px 2px 18px}
  .back{width:46px;height:46px;border-radius:16px;border:3px solid var(--line);background:#fff;cursor:pointer;
    font-size:20px;display:grid;place-items:center;box-shadow:0 5px 0 rgba(0,0,0,.06);flex:none}
  .back:active{transform:translateY(2px)}
  .htitle{font-family:var(--display);font-weight:700;font-size:24px}
  .htitle .zh{font-family:var(--zh);font-size:15px;color:var(--ink-soft);font-weight:800;margin-left:6px}
  .levels{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .lvl{border:3px solid var(--line);background:#fff;border-radius:22px;padding:16px 14px;cursor:pointer;text-align:left;
    font-family:var(--body);box-shadow:0 8px 0 rgba(0,0,0,.05);transition:transform .12s}
  .lvl:active{transform:translateY(3px)}
  .lvl .ic{font-size:30px;line-height:1}
  .lvl .nm{font-weight:900;font-size:15px;margin-top:8px;color:var(--ink)}
  .lvl .ds{font-weight:700;font-size:12px;color:var(--ink-soft);margin-top:2px}
  .lvl .ss{margin-top:6px;font-size:13px;color:var(--sun-d);font-weight:900;letter-spacing:1px}
  .lvl .ss .off{color:#E7DCC6}

  /* quiz */
  .prog{height:16px;background:#fff;border:3px solid var(--line);border-radius:999px;overflow:hidden;margin:2px 0 16px}
  .prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sun),var(--coral));transition:width .3s;border-radius:999px}
  .qcard{background:#fff;border:3px solid var(--line);border-radius:26px;padding:18px;box-shadow:var(--shadow)}
  .qask{font-family:var(--display);font-weight:700;font-size:21px;text-align:center;line-height:1.35;margin:4px 2px 14px}
  .qask .zh{font-family:var(--zh);font-weight:600}
  .qask .py{display:block;font-family:var(--body);font-size:14px;color:var(--blue-d);font-weight:800;margin-top:4px}
  .qask .blank{color:var(--coral);border-bottom:4px dotted var(--coral);padding:0 14px}
  .spk{margin:2px auto 12px;display:flex;align-items:center;gap:8px;background:#FFF3D6;border:3px solid var(--sun);
    color:var(--sun-d);font-weight:900;border-radius:999px;padding:8px 16px;cursor:pointer;font-family:var(--body);font-size:14px}
  .spk:active{transform:translateY(2px)}
  .opts{display:grid;gap:12px}
  .opts.two{grid-template-columns:1fr 1fr}
  .opt{border:3px solid var(--line);background:#fff;border-radius:18px;padding:15px 14px;cursor:pointer;font-family:var(--body);
    font-weight:900;font-size:17px;color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.05);transition:transform .1s;text-align:center;width:100%}
  .opt .py{display:block;font-size:12.5px;color:var(--blue-d);font-weight:800;margin-top:3px}
  .opt.zhopt{font-family:var(--zh);font-weight:700;font-size:21px}
  .opt:active{transform:translateY(2px)}
  .opt.right{border-color:var(--good);background:#E7FBF3;color:var(--mint-d);box-shadow:0 6px 0 rgba(47,167,132,.25)}
  .opt.wrong{border-color:var(--bad);background:#FFECE9;color:var(--coral-d);box-shadow:0 6px 0 rgba(232,91,76,.2)}
  .opt[disabled]{cursor:default}
  .next{margin-top:16px;width:100%;border:none;border-radius:18px;padding:16px;font-family:var(--display);font-weight:700;font-size:19px;
    color:#fff;background:linear-gradient(135deg,var(--blue),var(--grape));cursor:pointer;box-shadow:0 8px 0 rgba(60,90,140,.3);transition:transform .1s}
  .next:active{transform:translateY(3px)}
  .feedrow{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:900;font-size:16px}
  .feedrow.good{color:var(--mint-d)} .feedrow.bad{color:var(--coral-d)}

  /* study panels */
  .tip{background:#EEF7FF;border:3px solid var(--blue);border-radius:18px;padding:14px 16px;font-weight:800;line-height:1.5;font-size:15px;margin-bottom:14px}
  .read{background:#FFFDF6;border:3px dashed var(--sun);border-radius:18px;padding:18px 16px;line-height:2;font-weight:700;font-size:20px;font-family:var(--zh)}
  .read ruby rt{font-size:11px;color:var(--blue-d);font-family:var(--body);font-weight:700}
  .read.nopy ruby rt{display:none}
  .trans{background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px 14px;font-weight:700;font-size:14.5px;line-height:1.55;color:var(--ink-soft);margin-top:12px}
  .chiprow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .chip{border:3px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:900;font-size:13px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.05);font-family:var(--body)}
  .chip.on{background:linear-gradient(135deg,var(--blue),var(--grape));color:#fff;border-color:transparent}
  .chip:active{transform:translateY(2px)}

  .idiom{background:#fff;border:3px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 8px 0 rgba(0,0,0,.05);margin-bottom:14px}
  .idiom .head{display:flex;align-items:center;gap:10px;cursor:pointer}
  .idiom .izh{font-family:var(--zh);font-weight:700;font-size:26px}
  .idiom .ipy{font-weight:800;color:var(--blue-d);font-size:13.5px}
  .idiom .ien{font-weight:800;color:var(--ink-soft);font-size:13.5px;margin-top:2px}
  .idiom .plus{margin-left:auto;font-size:20px;color:var(--ink-soft);font-weight:900;width:34px;height:34px;border-radius:12px;border:3px solid var(--line);display:grid;place-items:center;flex:none}
  .idiom .body{display:none;margin-top:12px;border-top:2px dashed var(--line);padding-top:12px}
  .idiom.open .body{display:block;animation:pop .25s ease both}
  .irow{margin-bottom:10px;font-size:14.5px;line-height:1.55;font-weight:700}
  .irow .lab{display:inline-block;font-family:var(--display);font-weight:700;font-size:12px;color:#fff;background:var(--mint);border-radius:8px;padding:2px 8px;margin-right:6px}
  .irow .lab.d{background:var(--blue)} .irow .lab.e{background:var(--sun)} .irow .lab.s{background:var(--grape)} .irow .lab.a{background:var(--coral)}
  .irow .zh{font-family:var(--zh);font-weight:700}
  .irow .sub{color:var(--ink-soft);font-size:13px;margin-top:2px}
  .mini{margin-left:8px;border:2.5px solid var(--sun);background:#FFF3D6;color:var(--sun-d);border-radius:999px;padding:3px 10px;font-weight:900;font-size:12px;cursor:pointer;font-family:var(--body)}

  /* results */
  .result{text-align:center;background:#fff;border:3px solid var(--line);border-radius:28px;padding:26px 20px;box-shadow:var(--shadow)}
  .result .bigstars{font-size:46px;letter-spacing:6px;margin:6px 0 2px}
  .result h2{font-family:var(--display);font-weight:700;font-size:28px;margin:8px 0 2px}
  .result .sc{font-weight:900;color:var(--ink-soft);font-size:16px;margin-bottom:18px}
  .rbtns{display:grid;gap:12px}
  .btn{border:none;border-radius:18px;padding:15px;font-family:var(--display);font-weight:700;font-size:18px;color:#fff;cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.18);transition:transform .1s;width:100%}
  .btn:active{transform:translateY(3px)}
  .btn.go{background:linear-gradient(135deg,var(--mint),#7BD46B);box-shadow:0 8px 0 rgba(47,167,132,.3)}
  .btn.play{background:linear-gradient(135deg,var(--blue),var(--grape));box-shadow:0 8px 0 rgba(60,90,140,.3)}
  .btn.ghost{background:#fff;color:var(--ink-soft);border:3px solid var(--line);box-shadow:0 6px 0 rgba(0,0,0,.06)}

  .confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
  .conf{position:absolute;top:-12px;width:11px;height:14px;border-radius:2px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:1}}

  /* write tab */
  .wcard{background:#fff;border:3px solid var(--line);border-radius:26px;padding:20px 18px;box-shadow:var(--shadow);text-align:center}
  .wmean{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.3}
  .wpy{font-weight:800;color:var(--blue-d);font-size:15px;margin-top:4px}
  .winput{width:100%;font-family:var(--zh);font-weight:700;font-size:26px;text-align:center;color:var(--ink);background:#FFFDF8;border:3px solid var(--line);border-radius:15px;padding:12px 14px;margin-top:14px;letter-spacing:4px}
  .winput:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(91,169,240,.18)}
  .wdots{display:flex;justify-content:center;gap:7px;margin:14px 0 2px}
  .wdots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
  .wdots i.on{background:var(--coral)}
  .wfeed{margin-top:12px;font-weight:900;font-size:16px;min-height:24px}
  .wfeed.good{color:var(--mint-d)} .wfeed.bad{color:var(--coral-d)}
  .wans{margin-top:8px;font-family:var(--zh);font-weight:700;font-size:30px;letter-spacing:6px}
  .wans .ok{color:var(--mint-d)} .wans .no{color:var(--coral-d);text-decoration:underline wavy var(--coral-d)}

  /* bottom nav */
  .nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));z-index:40;
    background:#fff;border:3px solid var(--line);border-radius:24px;padding:8px;display:flex;gap:6px;box-shadow:var(--shadow);width:min(420px,calc(100% - 28px))}
  .navb{flex:1;border:none;background:transparent;border-radius:16px;padding:8px 4px;cursor:pointer;font-family:var(--body);font-weight:900;font-size:12.5px;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:3px}
  .navb span{font-size:21px}
  .navb.on{background:linear-gradient(135deg,var(--blue),var(--grape));color:#fff;box-shadow:0 5px 0 rgba(60,90,140,.25)}

  .hint{text-align:center;color:var(--ink-soft);font-weight:800;font-size:13.5px;margin-top:18px}
  .secttl{font-family:var(--display);font-weight:700;font-size:20px;margin:22px 2px 10px}
  @media(max-width:380px){ .qask{font-size:19px} .idiom .izh{font-size:23px} }

<div class="clouds"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div></div>
<div class="app" id="app"></div>
<div id="navhost"></div>
<div class="confetti" id="confetti"></div>
<script>
/* ============================================================
   SHARED HELPERS
   ============================================================ */
function bunny(mood){ // happy | cheer | think
  const eye = mood==='cheer' ? '<path d="M40 50 q5 -6 10 0" stroke="#3B3024" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M70 50 q5 -6 10 0" stroke="#3B3024" stroke-width="3" fill="none" stroke-linecap="round"/>'
    : '<circle cx="45" cy="52" r="4.5" fill="#3B3024"/><circle cx="75" cy="52" r="4.5" fill="#3B3024"/>';
  const mouth = mood==='think' ? '<circle cx="60" cy="64" r="3" fill="#3B3024"/>'
    : '<path d="M53 62 q7 8 14 0" stroke="#3B3024" stroke-width="3" fill="none" stroke-linecap="round"/>';
  return `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="42" cy="26" rx="11" ry="22" fill="#FBE3EC" stroke="#3B3024" stroke-width="3"/>
    <ellipse cx="78" cy="26" rx="11" ry="22" fill="#FBE3EC" stroke="#3B3024" stroke-width="3"/>
    <ellipse cx="42" cy="28" rx="5" ry="13" fill="#F7B8CE"/>
    <ellipse cx="78" cy="28" rx="5" ry="13" fill="#F7B8CE"/>
    <circle cx="60" cy="62" r="34" fill="#FCEAF1" stroke="#3B3024" stroke-width="3"/>
    <circle cx="44" cy="66" r="6" fill="#F7B8CE" opacity=".8"/>
    <circle cx="76" cy="66" r="6" fill="#F7B8CE" opacity=".8"/>
    ${eye}
    <path d="M57 57 l6 0 -3 4 z" fill="#E88AA8"/>
    ${mouth}
  </svg>`;
}
function confetti(){
  const box=document.querySelector('#confetti'); const colors=['#FF7A6B','#FFC43C','#46C9A0','#5BA9F0','#A87BE6','#FF9ECF'];
  for(let i=0;i<70;i++){
    const c=document.createElement('i'); c.className='conf';
    c.style.left=Math.random()*100+'vw'; c.style.background=colors[i%colors.length];
    c.style.animationDuration=(2.2+Math.random()*1.6)+'s'; c.style.animationDelay=(Math.random()*0.5)+'s';
    box.appendChild(c); setTimeout(()=>c.remove(),4200);
  }
}
document.addEventListener('click', e=>{
  if(e.target.closest('[data-hub]')){
    /* setting hash to '' when it is already '' fires no hashchange —
       re-route explicitly so Home always works (e.g. back from the Me screen) */
    if(location.hash==='' || location.hash==='#') route();
    else location.hash='';
  }
});

/* ============================================================
   AUTH + CLOUD SYNC (SRS 3.6–3.9)
   Talks to api/*.php. On static hosts (no PHP) it disables
   itself quietly and progress simply stays on the device.
   ============================================================ */
const BLAuth = (()=>{
const st = {available:false, checked:false, errDetail:'', user:null, csrf:'',
            lastSync:+(localStorage.getItem('bl-last-sync')||0)};
const reg = {};          /* appKey -> {get(), set(progress, rerender)} */
const timers = {};

function register(key, h){ reg[key]=h; }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const css = document.createElement('style');
css.textContent = `
.authbox{max-width:440px;margin:24px auto;background:#fff;border:3px solid #3B3024;border-radius:22px;box-shadow:6px 6px 0 #3B3024;padding:24px}
.authbox h2{margin:0 0 12px;font-family:var(--display)}
.authbox label{display:block;font-weight:700;margin:12px 0 4px;font-size:14px}
.authbox input{width:100%;box-sizing:border-box;border:3px solid #3B3024;border-radius:12px;padding:11px;font-size:15px;font-family:var(--body)}
.authbox .btn{margin-top:14px}
.authbox .msg{margin:10px 0;font-weight:700;font-size:14px}
.authbox .msg.bad{color:#D94848}.authbox .msg.good{color:#2E9E5B}
.authrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.authrow .btn{flex:1;min-width:120px;margin-top:0}
.authlink{background:none;border:none;color:#5BA9F0;font-weight:700;cursor:pointer;padding:0;font-size:14px;text-decoration:underline}
.profrow{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:2px dashed #eee;font-size:14px}
.profrow b{text-align:right}
.badge{display:inline-block;border:2px solid #3B3024;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700;background:#BEE3F8}
.mgmodal{position:fixed;inset:0;background:rgba(59,48,36,.45);display:flex;align-items:center;justify-content:center;z-index:99;padding:20px}
.mgmodal .authbox{margin:0;width:100%}
`;
document.head.appendChild(css);

async function api(path, method, body){
  const opt = {method: method||'GET', headers:{}};
  if(body){ opt.headers['Content-Type']='application/json'; opt.body=JSON.stringify(body); }
  if(st.csrf) opt.headers['X-CSRF']=st.csrf;
  const r = await fetch('api/'+path, opt);
  const d = await r.json().catch(()=>({ok:false,message:'Server error ('+r.status+')'}));
  return d;
}

async function init(){
  try{
    const r = await fetch('api/me.php');
    const txt = await r.text();
    let d;
    try{ d = JSON.parse(txt); }
    catch(e){
      st.available = false;
      st.errDetail = 'The server answered HTTP ' + r.status + ' but not with JSON. '
        + (txt.trim().startsWith('<?php')
           ? 'PHP is NOT executing — the file source was served instead. Ask your hoster to enable PHP for this folder.'
           : 'First bytes: ' + txt.slice(0,150).replace(/</g,'‹'));
      return;
    }
    if(d.error === 'not_installed'){ st.available=false; st.errDetail='The API says: not installed — finish install.php (it writes config.php).'; return; }
    st.available = true; st.csrf = d.csrf||''; st.user = d.user||null;
    if(st.user) syncAll(false);           /* silent max-merge on page load */
  }catch(e){
    st.available = false;
    st.errDetail = 'Could not reach api/me.php (' + (e.message||e) + '). Check that all files (including the api/ and lib/ folders) were uploaded and that PHP runs in this folder.';
  }finally{
    st.checked = true;
    route();   /* re-evaluate: landing page vs hub vs offline */
  }
}

/* ---------- sync (SRS 3.9: push debounced, server max-merges) ---------- */
function push(key){
  if(!st.available || !st.user || !reg[key]) return;
  clearTimeout(timers[key]);
  timers[key] = setTimeout(async ()=>{
    const s = reg[key].get();
    try{
      const d = await api('progress.php','POST',{app:key, coins:s.coins, stars:s.stars, done:s.done, updatedAt:Date.now()});
      if(d.ok && d.progress){
        reg[key].set(d.progress,false);
        st.lastSync = Date.now();
        localStorage.setItem('bl-last-sync', String(st.lastSync));
      }
    }catch(e){ /* offline: stays local, retried on next change */ }
  }, 1500);
}
async function syncAll(rerender){
  for(const key of ['bunny-zh','bunny-es']){
    if(!reg[key]) continue;
    const s = reg[key].get();
    try{
      const d = await api('progress.php','POST',{app:key, coins:s.coins, stars:s.stars, done:s.done, updatedAt:Date.now()});
      if(d.ok && d.progress) reg[key].set(d.progress, rerender);
    }catch(e){}
  }
  st.lastSync = Date.now(); localStorage.setItem('bl-last-sync', String(st.lastSync));
}
async function pullReplace(){
  for(const key of ['bunny-zh','bunny-es']){
    if(!reg[key]) continue;
    try{
      const d = await api('progress.php?app='+key);
      if(d.ok && d.progress) reg[key].set(d.progress, true);
    }catch(e){}
  }
}

/* ---------- first-login merge dialog (SRS REQ-3.9.x) ---------- */
async function mergeDialog(){
  let hasCloud = false;
  for(const key of ['bunny-zh','bunny-es']){
    try{
      const d = await api('progress.php?app='+key);
      if(d.ok && d.progress && (d.progress.coins > 0 ||
          Object.keys(d.progress.stars||{}).length || Object.keys(d.progress.done||{}).length)) hasCloud = true;
    }catch(e){}
  }
  if(!hasCloud){ await syncAll(false); enterApp(); return; }
  const m = document.createElement('div');
  m.className = 'mgmodal';
  m.innerHTML = `<div class="authbox">
    <h2>☁️ Sync your progress?</h2>
    <p>Combine the progress stored <b>on this device</b> with your <b>cloud account</b>?
    The best stars and the most coins are always kept — nothing is lost.</p>
    <div class="authrow">
      <button class="btn play" id="mgYes">Combine ✅</button>
      <button class="btn ghost" id="mgCloud" style="color:#3B3024">Use cloud only</button>
    </div></div>`;
  document.body.appendChild(m);
  m.querySelector('#mgYes').onclick = async ()=>{ m.remove(); await syncAll(false); showMe(); };
  m.querySelector('#mgCloud').onclick = async ()=>{ m.remove(); await pullReplace(); showMe(); };
}

/* ---------- auth actions ---------- */
async function login(username, password){
  const d = await api('login.php','POST',{username,password});
  if(d.ok){ st.user = d.user; if(d.csrf) st.csrf = d.csrf; mergeDialog(); }
  return d;
}
async function signup(username, password){
  const d = await api('register.php','POST',{username,password});
  if(d.ok){ st.user = d.user; if(d.csrf) st.csrf = d.csrf; await syncAll(false); }
  return d;
}
async function logout(){
  await api('logout.php','POST',{});
  st.user = null; st.csrf = '';
  /* logout destroys the server session — prime a fresh one so the next
     login/signup POST has a valid CSRF token for the current session. */
  try{
    const r = await fetch('api/me.php');
    const d = await r.json();
    if(d.ok) st.csrf = d.csrf || '';
  }catch(e){}
  showMe();
}
async function forgot(username){
  return api('forgot.php','POST',{username});
}
async function profileAction(action, extra){
  const d = await api('profile.php','POST',Object.assign({action}, extra||{}));
  if(d.ok && d.user) st.user = d.user;
  return d;
}

/* ---------- landing page (before entering the courses) ---------- */
function shouldGate(){
  return st.available && !st.user && !sessionStorage.getItem('bl-guest');
}
function showLanding(){
  const app = document.querySelector('#app');
  document.querySelector('#navhost').innerHTML='';
  app.innerHTML = `
  <div class="hubwrap">
    <div class="hubbrand">
      <div class="bun" style="margin:0 auto">${bunny('cheer')}</div>
      <h1>Bunny Learning</h1>
      <p>Learn Chinese &amp; Spanish — hop in! 🐰</p>
    </div>
    <div class="authbox" style="margin-top:8px">
      <button class="btn play" id="l_login">🚀 Log in</button>
      <button class="btn" style="background:#FFC43C;color:#3B3024;margin-top:12px" id="l_signup">🐰 Create account</button>
      <p style="text-align:center;margin:14px 0 0">
        <button class="authlink" id="l_guest">continue without an account →</button>
      </p>
      <p style="font-size:12px;color:#999;text-align:center;margin:10px 0 0">An account saves your stars &amp; coins in the cloud, so you can learn on any device.</p>
    </div>
  </div>`;
  const $ = s=>app.querySelector(s);
  $('#l_login').onclick  = ()=>{ location.hash='#/me'; renderAuth(app,'login'); };
  $('#l_signup').onclick = ()=>{ location.hash='#/me'; renderAuth(app,'signup'); };
  $('#l_guest').onclick  = ()=>{ sessionStorage.setItem('bl-guest','1'); renderHub(); };
}
function enterApp(){ sessionStorage.removeItem('bl-guest'); location.hash=''; route(); }

/* ---------- Me tab UI ---------- */
function showMe(){
  const app = document.querySelector('#app');
  if(!st.available){
    app.innerHTML = `<div class="authbox"><h2>👤 Me</h2>
      <p>This copy of Bunny Learning is running <b>without a working server connection</b>, so accounts and
      cloud sync are turned off. All progress is safely stored on this device. 🐰</p>
      ${st.errDetail ? `<p style="font-size:13px;color:#999"><b>Why?</b> ${esc(st.errDetail)}</p>` : ''}
      <p style="font-size:13px;color:#999">Server self-check: <a href="api/health.php" target="_blank" style="color:#5BA9F0">open api/health.php</a> and send the result to your admin.</p></div>`;
    return;
  }
  if(!st.user){ renderAuth(app); return; }
  renderProfile(app);
}

function renderAuth(app, mode, msg, msgBad){
  app.innerHTML = `<div class="authbox">

/* ============================================================
   TEXT-TO-SPEECH (Mandarin only: zh-TW first, then zh-CN.
   Characters are traditional, but pronunciation is Mandarin —
   Cantonese voices (zh-HK / yue) are deliberately excluded.)
   ============================================================ */
let zhVoice = null;
function pickZhVoice(){
  const vs = speechSynthesis.getVoices();
  const mandarin = vs.filter(v=>/^zh/i.test(v.lang) && !/zh[-_]HK/i.test(v.lang) && !/yue/i.test(v.lang));
  zhVoice = mandarin.find(v=>/zh[-_]TW/i.test(v.lang)) || mandarin[0] || null;
}
if('speechSynthesis' in window){ pickZhVoice(); }
function speak(text, rate){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = zhVoice ? zhVoice.lang : 'zh-TW';
  if(zhVoice) u.voice = zhVoice;
  u.rate = rate || 0.85;
  speechSynthesis.speak(u);
}

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sample(a,n,ex){ const pool=a.filter(x=>x!==ex); return shuffle(pool).slice(0,n); }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

   ============================================================ */
function buildQuestions(lesson){
  const qs=[]; const t=lesson.qtype;
  if(t==='zh2en' || t==='en2zh' || t==='py2zh' || t==='listen2zh'){
    const items=shuffle(WORDS).slice(0,8);
    items.forEach(w=>{
      const others=sample(WORDS,3,w);
      if(t==='zh2en'){
        qs.push({ask:`What does <span class="zh">${w.zh}</span> mean?`, py:w.py, speak:w.zh,
          opts:shuffle([w,...others]).map(o=>({label:o.en, ok:o===w}))});
      }else if(t==='en2zh'){
        qs.push({ask:`Which word means “${w.en}”?`, speak:w.en,
          opts:shuffle([w,...others]).map(o=>({label:o.zh, py:o.py, zh:1, ok:o===w}))});
      }else if(t==='py2zh'){
        qs.push({ask:`Which word is read <span class="py">${w.py}</span>?`, speak:w.zh,
          opts:shuffle([w,...others]).map(o=>({label:o.zh, zh:1, ok:o===w}))});
      }else{
        qs.push({ask:'🔊 Listen and tap the word you hear', speak:w.zh, autoSpeak:1,
          opts:shuffle([w,...others]).map(o=>({label:o.zh, py:o.py, zh:1, ok:o===w}))});
      }
    });
  }
  else if(t==='blank'){
    shuffle(BLANKS).forEach(b=>{
      qs.push({ask:`<span class="zh">${esc(b.pre)}</span><span class="blank">？</span><span class="zh">${esc(b.post)}</span>`,
        py:'Fill in: '+b.hint, speak:(b.pre+b.ans+b.post).replace(/[「」]/g,''),
        opts:shuffle(b.opts).map(o=>({label:o, zh:1, ok:o===b.ans}))});
    });
  }
  else if(t==='idiom'){
    IDIOMS.forEach(i=>{
      const others=sample(IDIOMS,2,i).concat([{zh:'七手八腳'},{zh:'暢所欲言'},{zh:'一籌莫展'},{zh:'急中生智'}]);
      const pool=shuffle(others.filter(o=>o.zh!==i.zh)).slice(0,3);
      qs.push({ask:`Which idiom means “${i.en}”?`, py:i.py, speak:i.zh,
        opts:shuffle([{zh:i.zh,ok:1},...pool.map(o=>({zh:o.zh}))]).map(o=>({label:o.zh, zh:1, ok:!!o.ok}))});
      const exQ = i.ex.replace(i.zh,'<span class="blank">？</span>');
      const pool2=shuffle(IDIOMS.filter(o=>o!==i)).map(o=>o.zh).concat(['七手八腳','暢所欲言']).slice(0,3);
      qs.push({ask:`<span class="zh">${exQ}</span>`, py:'Which idiom fits?', speak:i.ex,
        opts:shuffle([i.zh,...pool2]).map(o=>({label:o, zh:1, ok:o===i.zh}))});
    });
    return shuffle(qs);
  }
  return qs;
}

/* ---------- quiz play ---------- */
let Q=null;
function startQuiz(ch,l){
  Q={ch,l,qs:buildQuestions(l),i:0,first:0,done:false};
  renderQ();
}
function renderQ(){
  const q=Q.qs[Q.i];
  const two = q.opts.length===4 ? 'two' : '';
  app.innerHTML = `
  <div class="screen on">
    <div class="bar"><button class="back" id="bk">←</button><div class="htitle">${Q.l.nm}</div></div>
    <div class="prog"><i style="width:${(Q.i/Q.qs.length)*100}%"></i></div>
    <div class="qcard">
      <div class="qask">${q.ask}${q.py?`<span class="py">${q.py}</span>`:''}</div>
      ${q.speak?`<button class="spk" id="spk">🔊 Listen</button>`:''}
      <div class="opts ${two}">
        ${q.opts.map((o,i)=>`<button class="opt ${o.zh?'zhopt':''}" data-i="${i}">${o.label}${o.py?`<span class="py">${o.py}</span>`:''}</button>`).join('')}
      </div>
      <div class="feedrow" id="feed" style="display:none"></div>
      <button class="next" id="next" style="display:none">${Q.i===Q.qs.length-1?'See results 🏁':'Next →'}</button>
    </div>
  </div>`;
  $('#bk').onclick=()=>showChapter(CHAPTERS.indexOf(Q.ch));
  if(q.speak){ $('#spk').onclick=()=>speak(q.speak); }
  if(q.autoSpeak){ setTimeout(()=>speak(q.speak),350); }
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  $('#next').onclick=()=>{ Q.i++; Q.i<Q.qs.length ? renderQ() : showResult(); };
}
function answer(i){
  const q=Q.qs[Q.i];
  app.querySelectorAll('.opt').forEach((b,bi)=>{
    b.disabled=true;
    if(q.opts[bi].ok) b.classList.add('right');
    else if(bi===i) b.classList.add('wrong');
  });
  const good=q.opts[i].ok;
  if(good){ Q.first++; addCoins(10); }
  const feed=$('#feed');
  feed.style.display='flex';
  feed.className='feedrow '+(good?'good':'bad');
  feed.innerHTML = good
    ? `<div class="bun sm">${bunny('cheer')}</div> Great job! +10 🪙`
    : `<div class="bun sm">${bunny('think')}</div> Not quite — the answer is highlighted.`;
  $('#next').style.display='block';
  if(good) speak(q.opts[i].zh? q.opts[i].label : '好叻！');
}
function showResult(){
  const n=Q.qs.length, c=Q.first, pct=c/n;
  const st = pct===1?3 : pct>=0.7?2 : pct>=0.4?1 : 0;
  addStars(Q.l.id, st);
  if(st>=2) confetti();
  const msgs=['Keep practising — you’ll get there! 💪','Good effort! One more try? 🌱','Great work! Almost perfect! 🌟','Perfect! You’re a star! 🏆'];
  app.innerHTML = `
  <div class="screen on">
    <div class="result">
      <div class="bun" style="margin:0 auto">${bunny(st>=2?'cheer':'think')}</div>
      <div class="bigstars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div>
      <h2>${msgs[st]}</h2>
      <div class="sc">You answered ${c} of ${n} correctly on the first try</div>
      <div class="rbtns">
        <button class="btn play" id="again">Play again 🔁</button>
        <button class="btn ghost" id="back">Back to chapter</button>
      </div>
    </div>
  </div>`;

}

function startWrite(set){
  const items = set==='words' ? WORDS : IDIOMS;
  W={items:shuffle(items), i:0, ok:0, answered:false};
  renderW();
}
function renderW(){
  const it=W.items[W.i];
  $('#wbox').innerHTML = `
    <div class="qcard">
      <div class="prog" style="margin-bottom:14px"><i style="width:${(W.i/W.items.length)*100}%"></i></div>
      <div class="wcard" style="box-shadow:none;border:none;padding:4px">
        <div class="wmean">“${it.en}”</div>
        <div class="wpy">${it.py}</div>
        <button class="spk" id="wspk">🔊 Listen</button>
        <input class="winput" id="win" placeholder="寫在這裡…" autocomplete="off" autocapitalize="off" autocorrect="off" />
        <div class="wfeed" id="wfeed"></div>
        <div class="wans" id="wans"></div>
      </div>
      <div class="rbtns" style="margin-top:14px">
        <button class="btn play" id="wcheck">Check ✅</button>
        <button class="btn ghost" id="wshow">Show answer</button>
      </div>
    </div>`;
  const inp=$('#win');
  $('#wspk').onclick=()=>speak(it.zh);
  setTimeout(()=>speak(it.zh),350);
  const check=reveal=>{
    if(W.answered) return;
    const v=inp.value.trim().replace(/\s+/g,'');
    if(!v && !reveal){ inp.focus(); return; }
    W.answered=true;
    const good = v===it.zh;
    if(good){ W.ok++; addCoins(10); }
    const feed=$('#wfeed');
    feed.className='wfeed '+(good?'good':'bad');
    feed.textContent = good ? 'Perfect! 好叻！ +10 🪙' : (reveal ? 'Here is the answer:' : 'Not quite — compare carefully:');
    if(!good){
      let h='';
      for(let k=0;k<it.zh.length;k++){
        const c=it.zh[k];
        h+= v[k]===c ? `<span class="ok">${c}</span>` : `<span class="no">${c}</span>`;
      }
      $('#wans').innerHTML=h;
    } else {
      $('#wans').innerHTML=`<span class="ok">${it.zh}</span>`;
    }
    $('#wcheck').textContent = W.i===W.items.length-1 ? 'Finish 🏁' : 'Next →';
    $('#wcheck').onclick=nextW;
    inp.disabled=true;
  };
  $('#wcheck').onclick=()=>check(false);
  $('#wshow').onclick=()=>check(true);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ W.answered ? nextW() : check(false); } });
  inp.focus();
}
function nextW(){
  W.i++; W.answered=false;
  if(W.i<W.items.length){ renderW(); return; }
  const pct=W.ok/W.items.length;
  if(pct>=0.7) confetti();
  $('#wbox').innerHTML = `
    <div class="result">
      <div class="bun" style="margin:0 auto">${bunny(pct>=0.7?'cheer':'think')}</div>
      <div class="bigstars">${pct===1?'★★★':pct>=0.7?'★★☆':pct>=0.4?'★☆☆':'☆☆☆'}</div>
      <h2>${pct===1?'Flawless dictation! 🏆':pct>=0.7?'Well done! 🌟':'Keep practising! 💪'}</h2>
      <div class="sc">You wrote ${W.ok} of ${W.items.length} correctly</div>
      <div class="rbtns">
        <button class="btn play" id="wagain">Practise again 🔁</button>
        <button class="btn ghost" id="whome">Back to Play</button>
      </div>
    </div>`;
  $('#wagain').onclick=()=>showWriteTab();
  $('#whome').onclick=()=>setTab('play');
}

function setTab(t){
  currentTab=t;
  document.querySelectorAll('.navb').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  if(t==='play') showHome();
  else if(t==='read') showReadTab();

  else if(t==='me') BLAuth.showMe();
}

function mount(){
  const nh=document.querySelector('#navhost');
  nh.innerHTML=NAV;
  nh.querySelectorAll('.navb').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
  showHome();
}
/* register with cloud sync: server max-merged progress replaces local */
BLAuth.register('bunny-zh', {
  get: ()=>S,
  set(p, rerender){
    S.coins = Math.max(S.coins, p.coins||0);
    for(const k in (p.stars||{})) S.stars[k] = Math.max(S.stars[k]||0, p.stars[k]||0);
    for(const k in (p.done||{})) if(p.done[k]) S.done[k] = true;
    store.save(S); renderCoins();
    if(rerender) showHome();
  }
});
return {mount};
})();

/* ============================================================
   STATE + PERSISTENCE
   ============================================================ */
const store = {
  load(){ try{ return JSON.parse(localStorage.getItem('bunny-es')||'{}'); }catch(e){ return {}; } },
  save(s){ try{ localStorage.setItem('bunny-es', JSON.stringify(s)); }catch(e){} }
};
let S = Object.assign({coins:0, stars:{}, done:{}}, store.load());
function persist(){ store.save(S); if(window.BLSync) BLSync.push('bunny-es'); }
function starsOf(id){ return S.stars[id]||0; }
function addStars(id,n){ if(n>starsOf(id)){ S.stars[id]=n; persist(); } }
function addCoins(n){ S.coins+=n; persist(); renderCoins(); }

/* ============================================================
   TEXT-TO-SPEECH — Spanish (es-ES first, then any es-*)
   ============================================================ */
let esVoice = null;
function pickEsVoice(){
  const vs = speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang));
  esVoice = vs.find(v=>/es[-_]ES/i.test(v.lang)) || vs[0] || null;
}
/* One shared voiceschanged handler — assigning it twice would clobber
   the first module's re-pick when voices load asynchronously. */
if('speechSynthesis' in window){
  pickEsVoice();
  speechSynthesis.onvoiceschanged = () => { pickZhVoice(); pickEsVoice(); };
}
function speak(text, rate){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = esVoice ? esVoice.lang : 'es-ES';
  if(esVoice) u.voice = esVoice;
  u.rate = rate || 0.9;
  speechSynthesis.speak(u);
}

/* ============================================================
   HELPERS
   ============================================================ */
const $ = s=>document.querySelector(s);
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sample(a,n,ex){ return shuffle(a.filter(x=>x!==ex)).slice(0,n); }
function starRow(n){ let h=''; for(let i=0;i<3;i++) h+= i<n ? '★' : '<span class="off">★</span>'; return h; }
function confetti(){
  const box=$('#confetti'); const colors=['#FF7A6B','#FFC43C','#46C9A0','#5BA9F0','#A87BE6','#FF9ECF'];
  for(let i=0;i<70;i++){
    const c=document.createElement('i'); c.className='conf';
    c.style.left=Math.random()*100+'vw'; c.style.background=colors[i%colors.length];
    c.style.animationDuration=(2.2+Math.random()*1.6)+'s'; c.style.animationDelay=(Math.random()*0.5)+'s';
    box.appendChild(c); setTimeout(()=>c.remove(),4200);
  }
}

/* lessons generated for every set */
function lessonsOf(set){
  if(set.kind==='reading'){
    return [
      {id:set.id+'_read',   ic:'📖', nm:'Lee el texto', ds:'Read and listen to the text', kind:'read'},
      {id:set.id+'_comp',   ic:'🧩', nm:'Comprensión', ds:'Preguntas sobre el texto', kind:'quiz', qtype:'comp'},
      {id:set.id+'_vf',     ic:'✅', nm:'¿Verdadero o falso?', ds:'Decide si es verdad o mentira', kind:'quiz', qtype:'vf'},
      {id:set.id+'_cont',   ic:'🌍', nm:'¿Qué continente es?', ds:'Adivina el continente', kind:'quiz', qtype:'cont'},
      {id:set.id+'_cards',  ic:'🃏', nm:'Flashcards', ds:'Palabras importantes', kind:'cards'},
      {id:set.id+'_listen', ic:'🔊', nm:'Listen & Choose', ds:'Hear it, then find it', kind:'quiz', qtype:'listen'},
    ];
  }
  return [
    {id:set.id+'_cards',  ic:'🃏', nm:'Flashcards', ds:'Flip and listen', kind:'cards'},
    {id:set.id+'_es2en',  ic:'💬', nm:'Español → English', ds:'What does it mean?', kind:'quiz', qtype:'es2en'},
    {id:set.id+'_en2es',  ic:'🎯', nm:'English → Español', ds:'Pick the Spanish word', kind:'quiz', qtype:'en2es'},
    {id:set.id+'_listen', ic:'🔊', nm:'Listen & Choose', ds:'Hear it, then find it', kind:'quiz', qtype:'listen'},
  ];
}

/* ============================================================
   QUIZ BUILDER
   ============================================================ */
function buildQuestions(set, qtype){
  if(qtype==='comp')
    return shuffle(set.questions).map(x=>({ask:`<span class="es">${x.q}</span>`, speak:x.q,
      opts:shuffle(x.opts).map(o=>({label:o, es:1, ok:o===x.a}))}));
  if(qtype==='vf')
    return shuffle(set.truefalse).map(x=>({ask:`<span class="es">${x.s}</span>`, speak:x.s,
      opts:[{label:'✅ Verdadero', ok:x.ok}, {label:'❌ Falso', ok:!x.ok}]}));
  if(qtype==='cont')
    return shuffle(set.match).map(x=>({ask:`<span class="es">«${x.d}»</span><div class="qsub">¿Qué continente es?</div>`, speak:x.d,
      opts:shuffle(['América','Europa','África','Asia','Oceanía','La Antártida']).map(o=>({label:o, es:1, ok:o===x.a}))}));
  const items=shuffle(set.terms).slice(0, Math.min(8, set.terms.length));
  return items.map(t=>{
    const others=sample(set.terms,3,t);
    if(qtype==='es2en')
      return {ask:`What does <span class="es">${t.es}</span> mean?`, speak:t.es,
        opts:shuffle([t,...others]).map(o=>({label:o.en, ok:o===t}))};
    if(qtype==='en2es')
      return {ask:`How do you say “${t.en}” in Spanish?`, speak:t.en,
        opts:shuffle([t,...others]).map(o=>({label:o.es, es:1, ok:o===t}))};
    return {ask:'🔊 Listen and tap the word you hear', speak:t.es, autoSpeak:1,
      opts:shuffle([t,...others]).map(o=>({label:o.es, es:1, ok:o===t}))};
  });
}

let Q=null;
function startQuiz(st,l,si){
  Q={set:st,l,si,qs:buildQuestions(st,l.qtype),i:0,first:0};
  renderQ();
}
function renderQ(){
  const q=Q.qs[Q.i];
  app.innerHTML = `
  <div class="screen on">
    <div class="bar"><button class="back" id="bk">←</button><div class="htitle">${Q.l.nm}</div></div>
    <div class="prog"><i style="width:${(Q.i/Q.qs.length)*100}%"></i></div>
    <div class="qcard">
      <div class="qask">${q.ask}</div>
      ${q.speak&&q.autoSpeak?`<button class="spk" id="spk">🔊 Listen again</button>`:''}
      <div class="opts ${q.opts.length===4?'two':''}">
        ${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o.label}</button>`).join('')}
      </div>
      <div class="feedrow" id="feed" style="display:none"></div>
      <button class="next" id="next" style="display:none">${Q.i===Q.qs.length-1?'See results 🏁':'Next →'}</button>
    </div>
  </div>`;
  $('#bk').onclick=()=>showSet(Q.si);
  if(q.speak){ $('#spk').onclick=()=>speak(q.speak); }
  if(q.autoSpeak){ setTimeout(()=>speak(q.speak),350); }
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  $('#next').onclick=()=>{ Q.i++; Q.i<Q.qs.length ? renderQ() : showResult(); };
}
function answer(i){
  const q=Q.qs[Q.i];
  app.querySelectorAll('.opt').forEach((b,bi)=>{
    b.disabled=true;
    if(q.opts[bi].ok) b.classList.add('right');
    else if(bi===i) b.classList.add('wrong');
  });
  const good=q.opts[i].ok;
  if(good){ Q.first++; addCoins(10); }
  const feed=$('#feed');
  feed.style.display='flex'; feed.className='feedrow '+(good?'good':'bad');
  feed.innerHTML = good
    ? `<div class="bun sm">${bunny('cheer')}</div> ¡Muy bien! +10 🪙`
    : `<div class="bun sm">${bunny('think')}</div> Not quite — the answer is highlighted.`;
  $('#next').style.display='block';
  if(good && q.opts[i].es) speak(q.opts[i].label);
}
function showResult(){
  const n=Q.qs.length, c=Q.first, pct=c/n;
  const st = pct===1?3 : pct>=0.7?2 : pct>=0.4?1 : 0;
  addStars(Q.l.id, st);
  if(st>=2) confetti();
  const msgs=['Keep practising — you’ll get there! 💪','¡Buen trabajo! One more try? 🌱','Great work! Almost perfect! 🌟','¡Perfecto! You’re a star! 🏆'];
  app.innerHTML = `

    <div class="result">
      <div class="bun" style="margin:0 auto">${bunny(st>=2?'cheer':'think')}</div>
      <div class="bigstars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div>
      <h2>${msgs[st]}</h2>
      <div class="sc">You answered ${c} of ${n} correctly on the first try</div>
      <div class="rbtns">
        <button class="btn play" id="again">Play again 🔁</button>
        <button class="btn ghost" id="back">Back to unit</button>
      </div>
    </div>
  </div>`;
  $('#again').onclick=()=>startQuiz(Q.set,Q.l,Q.si);
  $('#back').onclick=()=>showSet(Q.si);
}

    <div id="wbox"></div>
  </div>`;
  app.querySelectorAll('#sets .chip').forEach(c=>c.onclick=()=>{
    app.querySelectorAll('#sets .chip').forEach(x=>x.classList.remove('on'));
    c.classList.add('on'); startWrite(SETS[+c.dataset.s]);
  });
  startWrite(SETS[0]);
}
function startWrite(st){
  W={set:st, items:shuffle(st.terms).slice(0,12), i:0, ok:0, answered:false};
  renderW();
}
function renderW(){
  const it=W.items[W.i];
  $('#wbox').innerHTML = `
    <div class="qcard">
      <div class="prog" style="margin-bottom:14px"><i style="width:${(W.i/W.items.length)*100}%"></i></div>
      <div class="wmean">“${it.en}”</div>
      <div style="text-align:center"><button class="spk" id="wspk">🔊 Listen</button></div>
      <input class="winput" id="win" placeholder="escribe aquí…" autocomplete="off" autocapitalize="off" autocorrect="off" />
      <div class="accents">${['á','é','í','ó','ú','ü','ñ','¿','¡'].map(a=>`<button class="acc" data-a="${a}">${a}</button>`).join('')}</div>
      <div class="wfeed" id="wfeed"></div>
      <div class="wans" id="wans"></div>
      <div class="rbtns" style="margin-top:14px">
        <button class="btn play" id="wcheck">Check ✅</button>
        <button class="btn ghost" id="wshow">Show answer</button>
      </div>
    </div>`;
  const inp=$('#win');
  $('#wspk').onclick=()=>speak(it.es);
  setTimeout(()=>speak(it.es),350);
  app.querySelectorAll('.acc').forEach(b=>b.onclick=()=>{
    const s=inp.selectionStart||inp.value.length, e=inp.selectionEnd||s;
    inp.value=inp.value.slice(0,s)+b.dataset.a+inp.value.slice(e);
    inp.focus(); inp.setSelectionRange(s+1,s+1);
  });
  const norm=v=>v.trim().toLowerCase().replace(/\s+/g,' ');
  const check=reveal=>{
    if(W.answered) return;
    const v=norm(inp.value);
    if(!v && !reveal){ inp.focus(); return; }
    W.answered=true;
    const good = v===norm(it.es);
    if(good){ W.ok++; addCoins(10); }
    const feed=$('#wfeed');
    feed.className='wfeed '+(good?'good':'bad');
    feed.textContent = good ? '¡Perfecto! +10 🪙' : (reveal ? 'Here is the answer:' : 'Not quite — compare carefully:');
    $('#wans').innerHTML = good ? `<span class="ok">${it.es}</span>`
      : it.es.split('').map((c,k)=> inp.value.trim()[k]===c ? `<span class="ok">${c}</span>` : `<span class="no">${c}</span>`).join('');
    $('#wcheck').textContent = W.i===W.items.length-1 ? 'Finish 🏁' : 'Next →';
    $('#wcheck').onclick=nextW;
    inp.disabled=true;
  };
  $('#wcheck').onclick=()=>check(false);
  $('#wshow').onclick=()=>check(true);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ W.answered ? nextW() : check(false); } });
  inp.focus();
}
function nextW(){
  W.i++; W.answered=false;
  if(W.i<W.items.length){ renderW(); return; }
  const pct=W.ok/W.items.length;
  if(pct>=0.7) confetti();
  $('#wbox').innerHTML = `
    <div class="result">
      <div class="bun" style="margin:0 auto">${bunny(pct>=0.7?'cheer':'think')}</div>
      <div class="bigstars">${pct===1?'★★★':pct>=0.7?'★★☆':pct>=0.4?'★☆☆':'☆☆☆'}</div>
      <h2>${pct===1?'¡Sin errores! 🏆':pct>=0.7?'Well done! 🌟':'Keep practising! 💪'}</h2>
      <div class="sc">You wrote ${W.ok} of ${W.items.length} correctly</div>
      <div class="rbtns">
        <button class="btn play" id="wagain">Practise again 🔁</button>
        <button class="btn ghost" id="whome">Back to Play</button>
      </div>
    </div>`;
  $('#wagain').onclick=()=>showWriteTab();
  $('#whome').onclick=()=>setTab('play');
}

/* ============================================================
   NAV + INIT
   ============================================================ */
function setTab(t){
  document.querySelectorAll('.navb').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  if(t==='play') showHome();
  else if(t==='cards') showFlashcards(SETS[0],null,0,true);
  else if(t==='write') showWriteTab();
  else if(t==='me') BLAuth.showMe();
}

function mount(){
  const nh=document.querySelector('#navhost');
  nh.innerHTML=NAV;
  nh.querySelectorAll('.navb').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
  showHome();
}
/* register with cloud sync: server max-merged progress replaces local */
BLAuth.register('bunny-es', {
  get: ()=>S,
  set(p, rerender){
    S.coins = Math.max(S.coins, p.coins||0);
    for(const k in (p.stars||{})) S.stars[k] = Math.max(S.stars[k]||0, p.stars[k]||0);
    for(const k in (p.done||{})) if(p.done[k]) S.done[k] = true;
    store.save(S); renderCoins();
    if(rerender) showHome();
  }
});
return {mount};
})();

/* ============================================================
   HUB + ROUTER
   ============================================================ */
/* Nav shown on the hub: Home stays active; the section tabs reopen the
   most recently used language app on that tab. If no app was used yet,
   pulse the language cards so the user picks one first. */
let pendingTab = null;

function hubNavHTML(){
  return `<nav class="nav">
    <button class="navb on" data-hub><span>🏠</span>Home</button>
    <button class="navb" data-hubtab="play"><span>🎮</span>Play</button>
    <button class="navb" data-hubtab="cards"><span>🃏</span>Cards</button>
    <button class="navb" data-hubtab="write"><span>✍️</span>Write</button>
    <button class="navb" data-hubtab="me"><span>👤</span>Me</button>
  </nav>`;
}

function hubTab(t){
  const nh=document.querySelector('#navhost');
  if(t==='me'){
    BLAuth.showMe();
    nh.querySelectorAll('.navb').forEach(b=>b.classList.toggle('on', b.dataset.hubtab==='me'));
    return;
  }
  const last=localStorage.getItem('bl-last-app');
  if(last!=='chinese' && last!=='spanish'){
    /* no language chosen yet — nudge the user toward the two cards */
    document.querySelectorAll('.hubcard').forEach(c=>{
      c.classList.remove('pickme'); void c.offsetWidth; c.classList.add('pickme');
    });
    return;
  }
  pendingTab = (last==='chinese' && t==='cards') ? 'read' : t;   /* ZH calls it "Read" */
  location.hash = last==='chinese' ? '#/chinese' : '#/spanish';
}

function renderHub(){
  const nh=document.querySelector('#navhost');
  nh.innerHTML=hubNavHTML();
  nh.querySelectorAll('[data-hubtab]').forEach(b=>b.onclick=()=>hubTab(b.dataset.hubtab));
  document.querySelector('#app').innerHTML=`
  <div class="hubwrap">
    <div class="hubbrand">
      <div class="bun" style="margin:0 auto">${bunny('happy')}</div>
      <h1>Bunny Learning</h1>
      <p>pick a language and hop in! 🐰</p>
    </div>
    <button class="hubcard hzh" onclick="location.hash='#/chinese'">
      <span class="badge">Grade 4 · Dictation</span>
      <h2>Bunny Chinese 中文</h2>
      <p>Vocabulary, passage &amp; idioms — with pinyin and Mandarin audio</p>
      <div class="em">🖌️</div>
    </button>
    <button class="hubcard hes" onclick="location.hash='#/spanish'">
      <span class="badge">Year 4 · Comunidad ZOOM</span>
      <h2>Bunny Spanish 🇪🇸</h2>
      <p>Flashcards, quizzes &amp; spelling — unit vocabulary</p>
      <div class="em">🃏</div>
    </button>
  </div>`;
}
function route(){
  const h=location.hash;
  if(h.startsWith('#/chinese')){
    localStorage.setItem('bl-last-app','chinese');
    ZH.mount();
    if(pendingTab){ const b=document.querySelector(`.navb[data-tab="${pendingTab}"]`); pendingTab=null; if(b) b.click(); }
  }
  else if(h.startsWith('#/spanish')){
    localStorage.setItem('bl-last-app','spanish');
    ES.mount();
    if(pendingTab){ const b=document.querySelector(`.navb[data-tab="${pendingTab}"]`); pendingTab=null; if(b) b.click(); }
  }
  else if(h.startsWith('#/me')){ renderHub(); BLAuth.showMe(); }
  else if(BLAuth.shouldGate()) BLAuth.showLanding();
  else { pendingTab=null; renderHub(); }
}
window.addEventListener('hashchange', route);
route();

if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
